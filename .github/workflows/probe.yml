name: Pobierz strony pkwadwokaci.pl
on:
  push:
    branches: [narzedzia-pobieranie]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p pk
          for s in obszar-dzialania service/prawo-cywilne service/prawo-karne service/prawo-administracyjne service/prawo-rodzinne service/prawo-rolne-i-przetworstwa-rolnego service/prawo-egzekucyjne-i-windykacja-naleznosc service/prawo-obrotu-nieruchomosciami service/prawo-zamowien-publicznych-i-pomocy-publicznej service/prawo-gospodarcze-i-handlowe; do
            f=pk/$(basename $s).html; curl -sSL -A "Mozilla/5.0" "https://pkwadwokaci.pl/$s/" -o "$f"; done
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add pk && git commit -m "Strony pkwadwokaci.pl" && git push
