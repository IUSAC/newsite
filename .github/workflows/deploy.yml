# Automatyczna publikacja strony na Seohost (FTP).
# Uruchamia się, gdy zmiany trafią na gałąź "produkcja"
# albo ręcznie: zakładka Actions -> "Publikacja na Seohost" -> Run workflow.
name: Publikacja na Seohost

on:
  push:
    branches: [produkcja]
  workflow_dispatch:

concurrency:
  group: deploy-seohost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod strony
        uses: actions/checkout@v4

      - name: Zainstaluj ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Pobierz brakujące materiały z Higgsfield
        continue-on-error: true
        run: python3 scripts/fetch_assets.py

      - name: Zainstaluj lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Wyślij pliki na serwer (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        # Serwer FTP Seohost (h85) ma w łańcuchu przeterminowany certyfikat.
        # Wyjątek dotyczy wyłącznie certyfikatu o tym odcisku; połączenie pozostaje szyfrowane.
        run: |
          set +e
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            debug 3;
            set ssl:verify-certificate/50:64:E0:0A:1D:4D:F5:C5:0E:39:41:7A:75:32:0C:99:8C:CF:BF:66 no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git* --exclude-glob .github/ --exclude-glob scripts/ \
              --exclude-glob assets.json --exclude-glob README.md --exclude-glob CLAUDE.md \
              ./ \"$FTP_DIR\";
            bye" > "$RUNNER_TEMP/lftp.log" 2>&1
          code=$?
          grep -v -i "PASS " "$RUNNER_TEMP/lftp.log" | tail -n 40
          if [ $code -ne 0 ]; then
            msg=$(grep -v -i "PASS \|WARNING: Certificate" "$RUNNER_TEMP/lftp.log" | grep -E "^<--- [45]|rror|mirror:|Fatal|Access|denied|put:" | tail -n 15 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=lftp::$msg"
            exit $code
          fi

      - name: Raport folderów na serwerze
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ssl:verify-certificate/50:64:E0:0A:1D:4D:F5:C5:0E:39:41:7A:75:32:0C:99:8C:CF:BF:66 no;
            set ftp:ssl-force true; set ftp:ssl-protect-data true;
            echo START=; pwd; echo ROOT=; cls -1 /; echo DOMAINS=; cls -1 /domains/;
            echo TARGET=\"$FTP_DIR\"; cls -1 \"$FTP_DIR\"; bye" 2>&1 | grep -v "WARNING: Certificate" > "$RUNNER_TEMP/ls.txt" || true
          msg=$(head -c 3000 "$RUNNER_TEMP/ls.txt" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=serwer::$msg"

