# Automatyczna publikacja strony na Seohost (FTP).
# Uruchamia się, gdy zmiany trafią na gałąź "produkcja"
# albo ręcznie: zakładka Actions -> "Publikacja na Seohost" -> Run workflow.
name: Publikacja na Seohost

on:
  push:
    branches: [produkcja]
  workflow_dispatch:

concurrency:
  group: deploy-seohost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod strony
        uses: actions/checkout@v4

      - name: Zainstaluj ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Pobierz brakujące materiały z Higgsfield
        continue-on-error: true
        run: python3 scripts/fetch_assets.py

      - name: Zainstaluj lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Wyślij pliki na serwer (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob .git* --exclude-glob .github/ --exclude-glob scripts/ \
              --exclude-glob assets.json --exclude-glob README.md --exclude-glob CLAUDE.md \
              ./ \"$FTP_DIR\";
            bye"
